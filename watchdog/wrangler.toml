name = "campusgroups-food-digest-watchdog"
main = "worker.mjs"
compatibility_date = "2026-10-06"
workers_dev = false

[vars]
REPOSITORY = "atfinke/campusgroups-food-digest"
REF = "main"

[triggers]
# UTC; the handler filters Chicago weekdays, 08:00 through 10:59, including DST.
crons = ["*/15 13-16 * * *"]

[observability]
enabled = true
